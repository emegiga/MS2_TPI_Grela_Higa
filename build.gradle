plugins {
    id 'java'
}

group = 'tupad.ms2'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}



test {
    useJUnitPlatform()
    // Permite regenerar los archivos golden: gradlew test -Dgolden.regenerar=true
    systemProperty 'golden.regenerar', System.getProperty('golden.regenerar', 'false')
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}